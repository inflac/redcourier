name: Feature Request
description: Suggest a feature for RedCourier
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Security and Privacy Impact
      description: Would this change what the WebDAV server, file hosts or Tor can see?
    validations:
      required: false
