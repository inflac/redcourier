plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing for GitHub releases. The keystore never goes into git
// (android/.gitignore); see README "Android release key". Android only
// installs an update over an existing app if both are signed with the same
// key, so this key must be kept for the lifetime of the app.
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withInputStream { keyProperties.load(it) }
}

android {
    namespace = "de.red.redcourier"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Required by flutter_local_notifications.
        coreLibraryDesugaringEnabled = true
    }

    defaultConfig {
        applicationId = "de.red.redcourier"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keyPropertiesFile.exists()) {
            release {
                storeFile = file(keyProperties["storeFile"])
                storePassword = keyProperties["storePassword"]
                keyAlias = keyProperties["keyAlias"]
                keyPassword = keyProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keyPropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                // Without android/key.properties the APK is signed with the local
                // debug key: fine for testing, not for publishing.
                logger.warn("android/key.properties not found: signing the release APK with the debug key.")
                signingConfig = signingConfigs.debug
            }
        }
    }

    // F-Droid rejects the Google-signed dependency list that AGP embeds by
    // default; it is also not needed outside the Play Store.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
